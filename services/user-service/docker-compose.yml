services:
  user-db:
    image: postgres:16
    container_name: user-db
    environment:
      POSTGRES_USER: user_db
      POSTGRES_PASSWORD: user_password
      POSTGRES_DB: user_db
    ports:
      - "5051:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data

volumes:
  user-db-data: